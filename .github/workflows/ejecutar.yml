name: Monitoreo de remociones en masa

on:
  # Cada 5 minutos: es el intervalo minimo que acepta GitHub Actions.
  # GitHub no garantiza puntualidad: en horas de carga puede retrasar u omitir
  # ejecuciones. Si Google/Bing empiezan a responder vacio o con error, subir a
  # cada 15 o 30 minutos ("*/15 * * * *" o "*/30 * * * *").
  # Alternativas: cada hora "0 * * * *", diario "0 11 * * *" (07:00 Chile).
  schedule:
    - cron: "*/5 * * * *"

  # Ejecucion manual desde la pestana Actions ("Run workflow").
  workflow_dispatch:
    inputs:
      lookback:
        description: "Horas hacia atras a revisar"
        required: false
        default: "24"
      notificar:
        description: "Crear issues con eventos nuevos"
        type: choice
        options:
          - "si"
          - "no"
        default: "si"

permissions:
  contents: write
  issues: write

concurrency:
  group: catastro-remociones
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar monitoreo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOKBACK: ${{ github.event.inputs.lookback || '24' }}
          NOTIFICAR: ${{ github.event.inputs.notificar || 'si' }}
        run: |
          EXTRA=""
          if [ "$NOTIFICAR" = "no" ]; then EXTRA="--sin-notificar"; fi
          python actualizar.py --lookback "$LOOKBACK" $EXTRA

      - name: Commit de datos y sitio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Sin cambios que versionar"
          else
            git commit -m "datos: actualizacion automatica $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
