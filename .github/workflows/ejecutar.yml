name: Monitoreo de remociones en masa

on:
  # Cada 6 horas: 00:00, 06:00, 12:00 y 18:00 UTC
  # (21:00, 03:00, 09:00 y 15:00 en Chile continental).
  # El minimo que acepta GitHub Actions es 5 minutos, pero no garantiza
  # puntualidad a esa frecuencia y castiga las fuentes con demasiadas consultas.
  # Alternativas: cada 12 h "0 */12 * * *", cada hora "0 * * * *",
  # cada 15 min "*/15 * * * *".
  schedule:
    - cron: "0 */6 * * *"

  # Ejecucion manual desde la pestana Actions ("Run workflow").
  workflow_dispatch:
    inputs:
      lookback:
        description: "Horas hacia atras a revisar"
        required: false
        default: "24"
      notificar:
        description: "Crear issues con eventos nuevos"
        type: choice
        options:
          - "si"
          - "no"
        default: "si"

permissions:
  contents: write
  issues: write

concurrency:
  group: catastro-remociones
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Ejecutar monitoreo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOKBACK: ${{ github.event.inputs.lookback || '24' }}
          NOTIFICAR: ${{ github.event.inputs.notificar || 'si' }}
        run: |
          EXTRA=""
          if [ "$NOTIFICAR" = "no" ]; then EXTRA="--sin-notificar"; fi
          python actualizar.py --lookback "$LOOKBACK" $EXTRA

      - name: Commit de datos y sitio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Sin cambios que versionar"
          else
            git commit -m "datos: actualizacion automatica $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
