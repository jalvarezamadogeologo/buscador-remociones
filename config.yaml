# ---------------------------------------------------------------------------
# Fuentes. Google News y Bing News funcionan sin API key.
# Los feeds RSS directos son opcionales: agregar aqui los que se quieran.
# ---------------------------------------------------------------------------
fuentes:
  google_news:
    activa: true
    base: "https://news.google.com/rss/search"
    parametros:
      hl: "es-419"
      gl: "CL"
      ceid: "CL:es-419"
    ventana_operador: true
  bing_news:
    activa: true
    base: "https://www.bing.com/news/search"
    parametros:
      format: "rss"
      mkt: "es-CL"
  feeds_rss: []
  # feeds_rss:
  #   - nombre: "Medio"
  #     url: "https://ejemplo.cl/rss.xml"

# Terminos principales para armar la consulta web (sin tildes)
consulta:
  max_terminos: 8
  sufijo_ventana: true   # agrega when:Nd en Google News segun --lookback
