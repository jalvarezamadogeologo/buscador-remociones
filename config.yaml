# Configuracion del catastro de remociones en masa (Chile)
#
# Las palabras clave se escriben sin tildes: el codigo normaliza el texto
# (minusculas, sin tildes, sin puntuacion) antes de comparar.

idioma: es
pais: CL
zona_horaria: America/Santiago

# Repositorio publico (para el enlace "Buscar en GitHub" del sitio)
repo: jalvarezamadogeologo/buscador-remociones

# Servidor local (boton "Actualizar" en modo local)
puerto_local: 8770

# Ventana por defecto (horas hacia atras) cuando no se pasa --lookback
lookback_horas: 24

# Maximo de eventos nuevos a notificar por corrida (0 = sin limite)
max_notificaciones: 20

# Maximo de geocodificaciones nuevas por corrida (Nominatim: 1 req/s)
max_geocodificaciones: 15

# Etiqueta de GitHub Issues para las notificaciones
etiqueta_issue: remocion-en-masa

# Resolucion de enlaces de Google News a la URL original del medio
# (sin API keys; usa el RPC interno de Google. Los resultados se cachean en
# data/urlcache.json y los fallos no se reintentan por defecto)
resolver_urls:
  activo: true
  maximo: 30     # peticiones de red por corrida
  pausa: 0.4     # segundos entre peticiones
  timeout: 15    # segundos por peticion

# Deduplicacion de la misma noticia entre medios
deduplicacion:
  umbral: 0.62              # titulos casi iguales (Jaccard 0-1)
  umbral_mismo_evento: 0.20 # mismo tipo+lugar+fecha y >=2 palabras en comun
  umbral_sin_lugar: 0.35    # mismo tipo+fecha y titulos parecidos (sin localidad)
  dias: 4                   # ventana de comparacion por fecha

# ---------------------------------------------------------------------------
# Tipos de evento. La primera clave de cada tipo se usa en la busqueda web.
# ---------------------------------------------------------------------------
tipos_evento:
  aluvion:
    etiqueta: "Aluvión / flujo de detritos"
    claves:
      - aluvion
      - flujo de detritos
      - flujo de barro
      - corriente de detritos
      - colada de barro
      - deslizamiento de lodo
      - deslizamiento de barro
  deslizamiento:
    etiqueta: "Deslizamiento"
    claves:
      - deslizamiento
      - derrumbe
      - remocion en masa
      - movimiento en masa
      - deslizamiento de tierra
      - corrimiento de tierra
  caida_rocas:
    etiqueta: "Caída de rocas"
    claves:
      - caida de rocas
      - caida de piedras
      - desprendimiento
      - desprendimiento de rocas
      - desprendimiento de cerro
      - rocas en la calzada
  alud:
    etiqueta: "Alud / avalancha"
    claves:
      - alud
      - avalancha
      - deslizamiento de nieve
  socavon:
    etiqueta: "Socavón"
    claves:
      - socavon
      - socavamiento
  volcamiento:
    etiqueta: "Volcamiento"
    claves:
      - volcamiento de estratos
      - toppling
      - vuelco de estratos
  flujo_tierra:
    etiqueta: "Flujo de tierra / reptación"
    claves:
      - flujo de tierra
      - flujo de suelo
      - solifluxion
      - reptacion
      - creep
  avalancha_rocas:
    etiqueta: "Avalancha de rocas"
    claves:
      - avalancha de rocas
      - avalancha de detritos
      - avalancha de escombros
  desborde_inundacion:
    etiqueta: "Desborde / inundación"
    claves:
      - desborde
      - desborde de rio
      - inundacion
      - inundaciones
      - anegamiento
      - crecida
      - riada
  lahar:
    etiqueta: "Lahar / flujo volcánico"
    claves:
      - lahar
      - flujo volcanico
      - flujo de lodo volcanico
  erosion:
    etiqueta: "Erosión / carcavamiento"
    claves:
      - erosion de ribera
      - erosion fluvial
      - carcavamiento
      - gully
      - socavacion
  subsidencia:
    etiqueta: "Subsidencia / colapso"
    claves:
      - subsidencia
      - hundimiento de terreno
      - colapso de terreno

# ---------------------------------------------------------------------------
# Filtro geografico. Se acepta el evento si menciona Chile o una region/comuna
# chilena; si solo hay coincidencia debil y ademas se menciona otro pais, se
# descarta (evita homonimos como Santiago de Cuba).
# Las comunas se usan tambien para completar la region del evento.
# ---------------------------------------------------------------------------
geografia:
  pais_claves:
    - chile
    - chileno
    - chilena
  instituciones_chile:
    - senapred
    - sernageomin
    - onemi
  regiones:
    - nombre: "Arica y Parinacota"
      comunas: ["Arica", "Putre", "Camarones"]
    - nombre: "Tarapaca"
      comunas: ["Iquique", "Alto Hospicio", "Pozo Almonte", "Huara", "Colchane"]
    - nombre: "Antofagasta"
      comunas: ["Antofagasta", "Calama", "Tocopilla", "Mejillones", "Taltal", "San Pedro de Atacama"]
    - nombre: "Atacama"
      comunas: ["Copiapo", "Vallenar", "Caldera", "Chanaral", "Diego de Almagro", "Huasco"]
    - nombre: "Coquimbo"
      comunas: ["La Serena", "Coquimbo", "Ovalle", "Illapel", "Los Vilos", "Combarbala", "Vicuna", "Salamanca", "Monte Patria"]
    - nombre: "Valparaiso"
      comunas: ["Valparaiso", "Vina del Mar", "Quilpue", "Villa Alemana", "San Antonio", "Quillota", "Los Andes", "San Felipe", "La Ligua", "Limache", "Concon", "Portillo", "Laguna del Inca"]
    - nombre: "Metropolitana"
      comunas: ["Santiago", "Puente Alto", "Maipu", "La Florida", "Las Condes", "Penalolen", "Colina", "Melipilla", "Talagante", "San Bernardo", "La Reina", "Vitacura", "Lo Barnechea"]
    - nombre: "O'Higgins"
      comunas: ["Rancagua", "San Fernando", "Santa Cruz", "Pichilemu", "Rengo", "Machali"]
    - nombre: "Maule"
      comunas: ["Talca", "Curico", "Linares", "Constitucion", "Cauquenes", "San Javier", "Molina"]
    - nombre: "Nuble"
      comunas: ["Chillan", "San Carlos", "Bulnes", "Quirihue", "Coelemu"]
    - nombre: "Biobio"
      comunas: ["Concepcion", "Talcahuano", "Los Angeles", "Arauco", "Coronel", "Lota", "Curanilahue", "Lebu", "Canete", "Nacimiento", "Mulchen"]
    - nombre: "La Araucania"
      comunas: ["Temuco", "Villarrica", "Pucon", "Angol", "Padre Las Casas", "Lautaro"]
    - nombre: "Los Rios"
      comunas: ["Valdivia", "Panguipulli", "Rio Bueno"]
    - nombre: "Los Lagos"
      comunas: ["Puerto Montt", "Osorno", "Castro", "Ancud", "Puerto Varas", "Calbuco", "Quellon"]
    - nombre: "Aysen"
      comunas: ["Coyhaique", "Puerto Aysen", "Puerto Cisnes", "Chile Chico", "Cochrane"]
    - nombre: "Magallanes"
      comunas: ["Punta Arenas", "Puerto Natales", "Porvenir", "Puerto Williams"]

  # Toponimos especificos (parajes, rutas y sectores) que, si aparecen en el
  # titulo, se usan para geocodificar antes que la comuna/region. Evita mandar
  # el punto al centro de la comuna cuando la noticia nombra un lugar puntual.
  toponimos:
    - Paso Cristo Redentor
    - Laguna del Inca
    - Portillo
    - Caracoles
    - Juan Riquelme
    - Higueras

  paises_excluir:
    - peru
    - argentina
    - bolivia
    - brasil
    - colombia
    - ecuador
    - mexico
    - venezuela
    - paraguay
    - uruguay
    - cuba
    - guatemala
    - honduras
    - el salvador
    - nicaragua
    - costa rica
    - panama
    - estados unidos
    - canada
    - espana
    - portugal
    - italia
    - francia
    - alemania
    - japon
    - china
    - india
    - australia

# ---------------------------------------------------------------------------
# Dominios de las fuentes. Solo se conservan paginas de medios .cl y .com: las
# noticias extranjeras comparten toponimos chilenos (Constitucion, Colina,
# Santa Cruz) o mencionan Chile y el clasificador las dejaba pasar.
# `excluidos` veta ademas medios extranjeros que usan .com (se puede editar):
#   metrolibre.com  -> Panama (SINAPROC), deslizamiento en San Carlos
#   infobae.com     -> Peru, desborde del rio Kimbiri en Cusco
#   elnacional.com  -> Venezuela, evento en Ecuador (Caluma, Los Rios)
# No se vetan msn.com (agrega medios chilenos) ni los medios de Mendoza
# (mdzol.com, mendozapost.com, mendovoz.com): cubren eventos reales de Chile.
# ---------------------------------------------------------------------------
dominios:
  activo: true
  permitidos: [".cl", ".com"]
  excluidos:
    - "metrolibre.com"
    - "infobae.com"
    - "elnacional.com"

# ---------------------------------------------------------------------------
# Fuentes. Google News y Bing News funcionan sin API key.
# Los feeds RSS directos son opcionales: agregar aqui los que se quieran.
# ---------------------------------------------------------------------------
fuentes:
  google_news:
    activa: true
    base: "https://news.google.com/rss/search"
    parametros:
      hl: "es-419"
      gl: "CL"
      ceid: "CL:es-419"
    ventana_operador: true
  bing_news:
    activa: true
    base: "https://www.bing.com/news/search"
    parametros:
      format: "rss"
      mkt: "es-CL"
  feeds_rss:
    # Feeds directos (verificados 2026-10-23). Complementan a los agregadores y
    # traen noticias regionales que Google/Bing a veces no indexan.
    - nombre: "La Tercera"
      url: "https://www.latercera.com/arc/outboundfeeds/rss/?outputType=xml"
    - nombre: "Cooperativa"
      url: "https://www.cooperativa.cl/noticias/site/tax/port/all/rss____1.xml"
    - nombre: "The Clinic"
      url: "https://www.theclinic.cl/feed/"
    - nombre: "La Discusión"
      url: "https://www.ladiscusion.cl/feed/"
    - nombre: "El Rancagüino"
      url: "https://www.elrancaguino.cl/feed/"
    - nombre: "La Prensa Austral"
      url: "https://www.laprensaaustral.cl/feed/"

# Terminos principales para armar la consulta web (sin tildes)
consulta:
  max_terminos: 10
  sufijo_ventana: true   # agrega when:Nd en Google News segun --lookback

# ---------------------------------------------------------------------------
# Redes sociales via Google News con `site:` (sin API keys).
# La cobertura depende de lo que Google indexe de cada red.
# ---------------------------------------------------------------------------
redes:
  activa: true
  activas: ["x", "instagram", "facebook"]
  max_resultados: 30   # por red y por corrida
